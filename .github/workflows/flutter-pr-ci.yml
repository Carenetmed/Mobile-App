name: Flutter PR CI

on:
  pull_request:
    branches:
      - feature/frontend-milestone
  push:
    branches:
      - feature/frontend-milestone
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test, build, and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out triggering integration commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$(git rev-parse HEAD^1)" = "$PR_BASE_SHA"
            test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"
          fi
          git show -s --format='Verified commit: %H; parents: %P' HEAD

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true

      - name: Print tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify dependency lock integrity
        run: git diff --exit-code -- pubspec.lock

      - name: Analyze
        run: flutter analyze

      - name: Android backup privacy policy
        shell: pwsh
        run: ./tool/check_android_backup_policy.ps1

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --flavor staging

      - name: Android release lint
        working-directory: android
        run: bash gradlew lintStagingRelease --console=plain

      - name: Protected release signing regression
        # Disposable certificates only; no distribution signing secrets in PR CI.
        shell: pwsh
        run: ./tool/check_android_release_signing.ps1

      - name: Release environment regression
        shell: pwsh
        run: ./tool/check_android_release_environment.ps1

      - name: Release transient build output
        if: always()
        run: rm -rf build
