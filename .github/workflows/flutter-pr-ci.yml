name: Flutter PR CI

on:
  pull_request:
    branches:
      - feature/frontend-milestone
  push:
    branches:
      - feature/frontend-milestone
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true

      - name: Print tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify dependency lock integrity
        run: git diff --exit-code -- pubspec.lock

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --flavor staging

      - name: Release transient build output
        if: always()
        run: rm -rf build
