org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Force Gradle to use the local JDK 17 instead of Android Studio's bundled JBR,
# to avoid TLS issues seen when downloading dependencies from Maven Central.
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# (Intentionally no forced TLS settings here. If you hit SSL download errors,
# fix the underlying network/AV interception rather than pinning protocols.)
